<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="avbat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62828"/></marker><marker id="av5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07a00"/></marker><marker id="av3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fd8"/></marker><marker id="agnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="asig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d8b"/></marker><marker id="amot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b2cbf"/></marker></defs><rect width="100%" height="100%" fill="#f3f5f8"/><text x="40" y="48" font-size="30" fill="#1d2430" font-weight="800" text-anchor="start">Etapa 2 — Regulador de +5 V y riel de +3,3 V</text><text x="40" y="76" font-size="16" fill="#5b6574" font-weight="400" text-anchor="start">VBAT → 7805 → +5 V → diodo → pad 5V del S3-Zero → LDO interno → +3,3 V para los periféricos</text><rect x="40" y="96" width="22" height="8" rx="4" fill="#d62828"/><text x="68" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">VBAT 7,4 V</text><rect x="178" y="96" width="22" height="8" rx="4" fill="#e07a00"/><text x="206" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">+5 V</text><rect x="268" y="96" width="22" height="8" rx="4" fill="#1d6fd8"/><text x="296" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">+3,3 V</text><rect x="374" y="96" width="22" height="8" rx="4" fill="#555555"/><text x="402" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">GND</text><rect x="456" y="96" width="22" height="8" rx="4" fill="#1f9d8b"/><text x="484" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">señal</text><rect x="554" y="96" width="22" height="8" rx="4" fill="#7b2cbf"/><text x="582" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">motor</text><text x="662" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">·  Borde punteado = fuera de la placa principal</text><rect x="40" y="266" width="128" height="20" rx="10" fill="#d62828"/><text x="104.0" y="280.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">VBAT (etapa 1)</text><path d="M40,300 L300,300" fill="none" stroke="#d62828" stroke-width="4" stroke-linejoin="round"/><circle cx="140" cy="300" r="4.5" fill="#d62828"/><path d="M140,300 L140,340" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round"/><line x1="127" y1="340" x2="153" y2="340" stroke="#d62828" stroke-width="3.2"/><line x1="127" y1="348" x2="153" y2="348" stroke="#d62828" stroke-width="3.2"/><path d="M140,348 L140,362" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="129.0" y1="362" x2="151.0" y2="362" stroke="#555555" stroke-width="3"/><line x1="133.0" y1="367" x2="147.0" y2="367" stroke="#555555" stroke-width="3"/><line x1="137.0" y1="372" x2="143.0" y2="372" stroke="#555555" stroke-width="3"/><text x="157" y="350" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">0,33 µF</text><circle cx="225" cy="300" r="4.5" fill="#d62828"/><path d="M225,300 L225,340" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round"/><line x1="212" y1="340" x2="238" y2="340" stroke="#d62828" stroke-width="3.2"/><line x1="212" y1="348" x2="238" y2="348" stroke="#d62828" stroke-width="3.2"/><path d="M225,348 L225,362" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="214.0" y1="362" x2="236.0" y2="362" stroke="#555555" stroke-width="3"/><line x1="218.0" y1="367" x2="232.0" y2="367" stroke="#555555" stroke-width="3"/><line x1="222.0" y1="372" x2="228.0" y2="372" stroke="#555555" stroke-width="3"/><text x="242" y="350" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">10 µF</text><rect x="300" y="245" width="200" height="130" rx="12" fill="#fff" stroke="#e07a00" stroke-width="2.4"/><text x="400" y="275" font-size="18" fill="#1d2430" font-weight="700" text-anchor="middle">U1  L7805CV</text><text x="400" y="295" font-size="12" fill="#5b6574" font-weight="400" text-anchor="middle">TO-220 · o drop-in conmutado</text><text x="400" y="311" font-size="12" fill="#5b6574" font-weight="400" text-anchor="middle">R-78E5.0-1.0 / OKI-78SR-5/1.5</text><text x="308" y="342" font-size="14" fill="#d62828" font-weight="700" text-anchor="start">1 Vin</text><text x="492" y="342" font-size="14" fill="#e07a00" font-weight="700" text-anchor="end">3 Vout</text><text x="400" y="366" font-size="14" fill="#555555" font-weight="700" text-anchor="middle">2 GND</text><path d="M400,375 L400,410" fill="none" stroke="#555555" stroke-width="3.2" stroke-linejoin="round"/><line x1="389.0" y1="410" x2="411.0" y2="410" stroke="#555555" stroke-width="3"/><line x1="393.0" y1="415" x2="407.0" y2="415" stroke="#555555" stroke-width="3"/><line x1="397.0" y1="420" x2="403.0" y2="420" stroke="#555555" stroke-width="3"/><path d="M500,300 L960,300" fill="none" stroke="#e07a00" stroke-width="4" stroke-linejoin="round"/><circle cx="570" cy="300" r="4.5" fill="#e07a00"/><path d="M570,300 L570,340" fill="none" stroke="#e07a00" stroke-width="3" stroke-linejoin="round"/><line x1="557" y1="340" x2="583" y2="340" stroke="#e07a00" stroke-width="3.2"/><line x1="557" y1="348" x2="583" y2="348" stroke="#e07a00" stroke-width="3.2"/><path d="M570,348 L570,362" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="559.0" y1="362" x2="581.0" y2="362" stroke="#555555" stroke-width="3"/><line x1="563.0" y1="367" x2="577.0" y2="367" stroke="#555555" stroke-width="3"/><line x1="567.0" y1="372" x2="573.0" y2="372" stroke="#555555" stroke-width="3"/><text x="587" y="350" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">0,1 µF</text><circle cx="650" cy="300" r="4.5" fill="#e07a00"/><path d="M650,300 L650,340" fill="none" stroke="#e07a00" stroke-width="3" stroke-linejoin="round"/><line x1="637" y1="340" x2="663" y2="340" stroke="#e07a00" stroke-width="3.2"/><line x1="637" y1="348" x2="663" y2="348" stroke="#e07a00" stroke-width="3.2"/><path d="M650,348 L650,362" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="639.0" y1="362" x2="661.0" y2="362" stroke="#555555" stroke-width="3"/><line x1="643.0" y1="367" x2="657.0" y2="367" stroke="#555555" stroke-width="3"/><line x1="647.0" y1="372" x2="653.0" y2="372" stroke="#555555" stroke-width="3"/><text x="667" y="350" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">10 µF</text><circle cx="740" cy="300" r="4.5" fill="#e07a00"/><path d="M740,300 L740,420" fill="none" stroke="#e07a00" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#av5)"/><rect x="625" y="420" width="240" height="136" rx="12" fill="#fff" stroke="#1f9d8b" stroke-width="2.4" stroke-dasharray="7 5"/><rect x="625" y="420" width="8" height="136" rx="4" fill="#1f9d8b"/><text x="647" y="447" font-size="18" fill="#1d2430" font-weight="700" text-anchor="start">4 × Sharp GP2Y0E03</text><text x="647" y="474" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">VDD = +5 V (antes del</text><text x="647" y="496" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">diodo) · 10 µF + 100 nF</text><text x="647" y="518" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">por conector</text><text x="745" y="580" font-size="14" fill="#5b6574" font-weight="700" text-anchor="middle">→ Etapa 5</text><path d="M820,300 L860,300" fill="none" stroke="#e07a00" stroke-width="3.2" stroke-linejoin="round"/><path d="M860,285 L860,315 L892,300 z" fill="#e07a00"/><line x1="892" y1="285" x2="892" y2="315" stroke="#e07a00" stroke-width="4"/><path d="M892,300 L932,300" fill="none" stroke="#e07a00" stroke-width="3.2" stroke-linejoin="round"/><text x="876" y="276" font-size="14" fill="#1d2430" font-weight="700" text-anchor="middle">D1 SS14</text><text x="930" y="334" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="middle">≈ 4,6 V</text><rect x="960" y="195" width="340" height="395" rx="12" fill="#fff" stroke="#1f9d8b" stroke-width="2.4"/><rect x="960" y="195" width="8" height="395" rx="4" fill="#1f9d8b"/><text x="985" y="222" font-size="19" fill="#1d2430" font-weight="700" text-anchor="start">ESP32-S3-Zero</text><rect x="1100" y="160" width="70" height="26" rx="4" fill="#aeb6c4"/><text x="1135" y="178" font-size="12" fill="#1d2430" font-weight="700" text-anchor="middle">USB-C</text><text x="1180" y="178" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">solo para programar</text><circle cx="960" cy="300" r="6" fill="#d9b44a"/><text x="972" y="326" font-size="13" fill="#e07a00" font-weight="700" text-anchor="start">pad 5V</text><path d="M966,300 L1040,300" fill="none" stroke="#e07a00" stroke-width="3.2" stroke-linejoin="round"/><rect x="1040" y="265" width="190" height="70" rx="8" fill="#eef1f6" stroke="#1d6fd8" stroke-width="2.2"/><text x="1135" y="292" font-size="15" fill="#1d2430" font-weight="700" text-anchor="middle">LDO ME6217C33</text><text x="1135" y="314" font-size="13" fill="#5b6574" font-weight="400" text-anchor="middle">3,3 V · 800 mA</text><path d="M1230,300 L1294,300" fill="none" stroke="#1d6fd8" stroke-width="3.2" stroke-linejoin="round"/><circle cx="1300" cy="300" r="6" fill="#d9b44a"/><text x="1290" y="326" font-size="13" fill="#1d6fd8" font-weight="700" text-anchor="end">pad 3V3</text><text x="985" y="372" font-size="13.5" fill="#1d2430" font-weight="400" text-anchor="start">Con solo el USB conectado, los Sharp y los</text><text x="985" y="392" font-size="13.5" fill="#1d2430" font-weight="400" text-anchor="start">motores quedan apagados: es lo deseable</text><text x="985" y="412" font-size="13.5" fill="#1d2430" font-weight="400" text-anchor="start">al programar.</text><text x="985" y="452" font-size="13.5" fill="#1d2430" font-weight="400" text-anchor="start">10 µF + 100 nF en el pad 5V y en el 3V3,</text><text x="985" y="472" font-size="13.5" fill="#1d2430" font-weight="400" text-anchor="start">cerca del S3-Zero.</text><text x="985" y="512" font-size="13" fill="#5b6574" font-weight="400" text-anchor="start">[verificar] cómo une Waveshare VBUS y el</text><text x="985" y="530" font-size="13" fill="#5b6574" font-weight="400" text-anchor="start">pad 5V antes de depender del diodo D1.</text><circle cx="1130" cy="590" r="6" fill="#d9b44a"/><path d="M1130,596 L1130,620" fill="none" stroke="#555555" stroke-width="3.2" stroke-linejoin="round"/><line x1="1119.0" y1="620" x2="1141.0" y2="620" stroke="#555555" stroke-width="3"/><line x1="1123.0" y1="625" x2="1137.0" y2="625" stroke="#555555" stroke-width="3"/><line x1="1127.0" y1="630" x2="1133.0" y2="630" stroke="#555555" stroke-width="3"/><text x="1148" y="612" font-size="13" fill="#555555" font-weight="700" text-anchor="start">pad GND</text><path d="M1300,300 L1340,300 L1340,635" fill="none" stroke="#1d6fd8" stroke-width="4" stroke-linejoin="round"/><rect x="1316" y="262" width="64" height="20" rx="10" fill="#1d6fd8"/><text x="1348.0" y="276.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">+3,3 V</text><circle cx="1340" cy="380" r="4.5" fill="#1d6fd8"/><path d="M1340,380 L1400,380" fill="none" stroke="#1d6fd8" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#av3)"/><rect x="1400" y="355" width="190" height="50" rx="8" fill="#fff" stroke="#1d6fd8" stroke-width="2.2"/><text x="1412" y="376" font-size="15" fill="#1d2430" font-weight="700" text-anchor="start">Encoders ×2</text><text x="1412" y="395" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">pin 3 de cada motor</text><circle cx="1340" cy="445" r="4.5" fill="#1d6fd8"/><path d="M1340,445 L1400,445" fill="none" stroke="#1d6fd8" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#av3)"/><rect x="1400" y="420" width="190" height="50" rx="8" fill="#fff" stroke="#1d6fd8" stroke-width="2.2"/><text x="1412" y="441" font-size="15" fill="#1d2430" font-weight="700" text-anchor="start">QRE1113GR</text><text x="1412" y="460" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">pin 2 del conector</text><circle cx="1340" cy="510" r="4.5" fill="#1d6fd8"/><path d="M1340,510 L1400,510" fill="none" stroke="#1d6fd8" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#av3)"/><rect x="1400" y="485" width="190" height="50" rx="8" fill="#fff" stroke="#1d6fd8" stroke-width="2.2"/><text x="1412" y="506" font-size="15" fill="#1d2430" font-weight="700" text-anchor="start">TB6612FNG</text><text x="1412" y="525" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">Vcc, pin 20</text><circle cx="1340" cy="575" r="4.5" fill="#1d6fd8"/><path d="M1340,575 L1400,575" fill="none" stroke="#1d6fd8" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#av3)"/><rect x="1400" y="550" width="190" height="50" rx="8" fill="#fff" stroke="#1d6fd8" stroke-width="2.2"/><text x="1412" y="571" font-size="15" fill="#1d2430" font-weight="700" text-anchor="start">Sharp ×4</text><text x="1412" y="590" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">VIN(IO) y GPIO1</text><circle cx="1340" cy="640" r="4.5" fill="#1d6fd8"/><path d="M1340,640 L1400,640" fill="none" stroke="#1d6fd8" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#av3)"/><rect x="1400" y="615" width="190" height="50" rx="8" fill="#fff" stroke="#1d6fd8" stroke-width="2.2"/><text x="1412" y="636" font-size="15" fill="#1d2430" font-weight="700" text-anchor="start">START</text><text x="1412" y="655" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">pull-up 10 kΩ</text><rect x="40" y="640" width="880" height="180" rx="12" fill="#fff" stroke="#e07a00" stroke-width="2.4"/><rect x="40" y="640" width="8" height="180" rx="4" fill="#e07a00"/><text x="62" y="667" font-size="18" fill="#1d2430" font-weight="700" text-anchor="start">Notas del regulador</text><text x="62" y="694" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">Con L7805CV (lineal) pierde (Vbat − 5 V) × I en calor: con 8,4 V son ≈ 1 W a 0,3 A y ≈ 1,7 W a 0,5 A.</text><text x="62" y="716" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">Su caída mínima es ~2 V: por debajo de ~7 V de batería la salida deja de ser 5 V.</text><text x="62" y="738" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">El drop-in conmutado tiene los mismos 3 pines (1 Vin · 2 GND · 3 Vout), ~90 % de rendimiento</text><text x="62" y="760" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">y casi no calienta. Soldar primero el drop-in si se consigue; el L7805 queda de plan B.</text><text x="62" y="782" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">Consumo en 5 V ≈ 0,3 – 0,5 A (4 Sharp de 26–36 mA + S3-Zero con Wi-Fi de 100–350 mA).</text></svg>