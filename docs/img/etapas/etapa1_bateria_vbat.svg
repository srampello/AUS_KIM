<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="avbat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62828"/></marker><marker id="av5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07a00"/></marker><marker id="av3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fd8"/></marker><marker id="agnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="asig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d8b"/></marker><marker id="amot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b2cbf"/></marker></defs><rect width="100%" height="100%" fill="#f3f5f8"/><text x="40" y="48" font-size="30" fill="#1d2430" font-weight="800" text-anchor="start">Etapa 1 — Batería, protección y bus VBAT</text><text x="40" y="76" font-size="16" fill="#5b6574" font-weight="400" text-anchor="start">De la batería LiPo 2S hasta el riel VBAT (6,0 – 8,4 V) que alimenta driver, regulador y medición de batería</text><rect x="40" y="96" width="22" height="8" rx="4" fill="#d62828"/><text x="68" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">VBAT 7,4 V</text><rect x="178" y="96" width="22" height="8" rx="4" fill="#e07a00"/><text x="206" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">+5 V</text><rect x="268" y="96" width="22" height="8" rx="4" fill="#1d6fd8"/><text x="296" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">+3,3 V</text><rect x="374" y="96" width="22" height="8" rx="4" fill="#555555"/><text x="402" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">GND</text><rect x="456" y="96" width="22" height="8" rx="4" fill="#1f9d8b"/><text x="484" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">señal</text><rect x="554" y="96" width="22" height="8" rx="4" fill="#7b2cbf"/><text x="582" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">motor</text><text x="662" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">·  Borde punteado = fuera de la placa principal</text><rect x="30" y="229" width="200" height="136" rx="12" fill="#fff" stroke="#d62828" stroke-width="2.4" stroke-dasharray="7 5"/><rect x="30" y="229" width="8" height="136" rx="4" fill="#d62828"/><text x="52" y="256" font-size="18" fill="#1d2430" font-weight="700" text-anchor="start">Batería LiPo 2S</text><text x="52" y="283" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">7,4 V nominal</text><text x="52" y="305" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">6,0 – 8,4 V</text><text x="52" y="327" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">conector XT30/JST</text><path d="M230,300 L250,300" fill="none" stroke="#d62828" stroke-width="3.2" stroke-linejoin="round"/><rect x="250" y="255" width="110" height="90" rx="12" fill="#fff" stroke="#d62828" stroke-width="2.4"/><rect x="250" y="255" width="8" height="90" rx="4" fill="#d62828"/><text x="272" y="282" font-size="18" fill="#1d2430" font-weight="700" text-anchor="start">SW1</text><text x="272" y="309" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">interruptor</text><text x="272" y="331" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">general</text><path d="M360,300 L410,300" fill="none" stroke="#d62828" stroke-width="3.2" stroke-linejoin="round"/><rect x="410" y="255" width="110" height="90" rx="12" fill="#fff" stroke="#d62828" stroke-width="2.4"/><rect x="410" y="255" width="8" height="90" rx="4" fill="#d62828"/><text x="432" y="282" font-size="18" fill="#1d2430" font-weight="700" text-anchor="start">F1</text><text x="432" y="309" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">fusible</text><text x="432" y="331" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">reset. 2 A</text><path d="M520,300 L580,300" fill="none" stroke="#d62828" stroke-width="3.2" stroke-linejoin="round"/><rect x="580" y="255" width="175" height="90" rx="12" fill="#fff" stroke="#d62828" stroke-width="2.4"/><rect x="580" y="255" width="8" height="90" rx="4" fill="#d62828"/><text x="602" y="282" font-size="18" fill="#1d2430" font-weight="700" text-anchor="start">Q1 AO3401A</text><text x="602" y="309" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">MOSFET canal P</text><text x="602" y="331" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">anti-inversión</text><text x="655" y="372" font-size="13" fill="#5b6574" font-weight="400" text-anchor="middle">compuerta a GND:</text><text x="655" y="390" font-size="13" fill="#5b6574" font-weight="400" text-anchor="middle">conduce solo con polaridad correcta</text><path d="M755,300 L1540,300" fill="none" stroke="#d62828" stroke-width="4.2" stroke-linejoin="round"/><rect x="775" y="268" width="144" height="20" rx="10" fill="#d62828"/><text x="847.0" y="282.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">VBAT 6,0 – 8,4 V</text><path d="M127,371 L127,470" fill="none" stroke="#555555" stroke-width="3.2" stroke-linejoin="round"/><line x1="116.0" y1="470" x2="138.0" y2="470" stroke="#555555" stroke-width="3"/><line x1="120.0" y1="475" x2="134.0" y2="475" stroke="#555555" stroke-width="3"/><line x1="124.0" y1="480" x2="130.0" y2="480" stroke="#555555" stroke-width="3"/><text x="147" y="468" font-size="13" fill="#5b6574" font-weight="400" text-anchor="start">negativo de la batería → plano de GND</text><circle cx="840" cy="300" r="4.5" fill="#d62828"/><path d="M840,300 L840,340" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round"/><line x1="827" y1="340" x2="853" y2="340" stroke="#d62828" stroke-width="3.2"/><line x1="827" y1="348" x2="853" y2="348" stroke="#d62828" stroke-width="3.2"/><path d="M840,348 L840,362" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="829.0" y1="362" x2="851.0" y2="362" stroke="#555555" stroke-width="3"/><line x1="833.0" y1="367" x2="847.0" y2="367" stroke="#555555" stroke-width="3"/><line x1="837.0" y1="372" x2="843.0" y2="372" stroke="#555555" stroke-width="3"/><text x="857" y="350" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">C1 100 µF</text><circle cx="960" cy="300" r="4.5" fill="#d62828"/><path d="M960,300 L960,340" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round"/><line x1="947" y1="340" x2="973" y2="340" stroke="#d62828" stroke-width="3.2"/><line x1="947" y1="348" x2="973" y2="348" stroke="#d62828" stroke-width="3.2"/><path d="M960,348 L960,362" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="949.0" y1="362" x2="971.0" y2="362" stroke="#555555" stroke-width="3"/><line x1="953.0" y1="367" x2="967.0" y2="367" stroke="#555555" stroke-width="3"/><line x1="957.0" y1="372" x2="963.0" y2="372" stroke="#555555" stroke-width="3"/><text x="977" y="350" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">C2 10 µF</text><text x="840" y="392" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">100 µF ≥ 16 V · 10 µF cerámico 25 V</text><circle cx="1110" cy="300" r="4.5" fill="#d62828"/><path d="M1110,300 L1110,420" fill="none" stroke="#d62828" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#avbat)"/><rect x="1005" y="420" width="210" height="114" rx="12" fill="#fff" stroke="#7b2cbf" stroke-width="2.4"/><rect x="1005" y="420" width="8" height="114" rx="4" fill="#7b2cbf"/><text x="1027" y="447" font-size="18" fill="#1d2430" font-weight="700" text-anchor="start">TB6612FNG</text><text x="1027" y="474" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">VM: pines 13, 14, 24</text><text x="1027" y="496" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">10 µF + 100 nF al chip</text><text x="1110" y="570" font-size="14" fill="#5b6574" font-weight="700" text-anchor="middle">→ Etapa 3</text><circle cx="1230" cy="300" r="4.5" fill="#d62828"/><path d="M1230,300 L1230,310" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round"/><rect x="1222" y="310" width="16" height="34" rx="3" fill="#fff" stroke="#d62828" stroke-width="2.4"/><path d="M1230,344 L1230,354" fill="none" stroke="#d62828" stroke-width="3" stroke-linejoin="round"/><text x="1246" y="332.0" font-size="13" fill="#1d2430" font-weight="400" text-anchor="start">R1 100 kΩ</text><circle cx="1230" cy="354" r="4.5" fill="#1f9d8b"/><path d="M1230,354 L1430,354" fill="none" stroke="#1f9d8b" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#asig)"/><text x="1352" y="342" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="start">GPIO3 (ADC1)</text><circle cx="1340" cy="354" r="4.5" fill="#1f9d8b"/><path d="M1340,354 L1340,384" fill="none" stroke="#1f9d8b" stroke-width="3" stroke-linejoin="round"/><line x1="1327" y1="384" x2="1353" y2="384" stroke="#1f9d8b" stroke-width="3.2"/><line x1="1327" y1="392" x2="1353" y2="392" stroke="#1f9d8b" stroke-width="3.2"/><path d="M1340,392 L1340,406" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="1329.0" y1="406" x2="1351.0" y2="406" stroke="#555555" stroke-width="3"/><line x1="1333.0" y1="411" x2="1347.0" y2="411" stroke="#555555" stroke-width="3"/><line x1="1337.0" y1="416" x2="1343.0" y2="416" stroke="#555555" stroke-width="3"/><text x="1357" y="394" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">100 nF</text><path d="M1230,354 L1230,364" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><rect x="1222" y="364" width="16" height="34" rx="3" fill="#fff" stroke="#555555" stroke-width="2.4"/><path d="M1230,398 L1230,408" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><text x="1246" y="386.0" font-size="13" fill="#1d2430" font-weight="400" text-anchor="start">R2 47 kΩ</text><line x1="1219.0" y1="408" x2="1241.0" y2="408" stroke="#555555" stroke-width="3"/><line x1="1223.0" y1="413" x2="1237.0" y2="413" stroke="#555555" stroke-width="3"/><line x1="1227.0" y1="418" x2="1233.0" y2="418" stroke="#555555" stroke-width="3"/><text x="1252" y="448" font-size="14" fill="#1d2430" font-weight="700" text-anchor="start">Divisor de batería</text><text x="1252" y="466" font-size="13" fill="#5b6574" font-weight="400" text-anchor="start">8,4 V → ≈ 2,7 V</text><circle cx="1500" cy="300" r="4.5" fill="#d62828"/><path d="M1500,300 L1500,420" fill="none" stroke="#d62828" stroke-width="3.2" stroke-linejoin="round" marker-end="url(#avbat)"/><rect x="1405" y="420" width="190" height="114" rx="12" fill="#fff" stroke="#e07a00" stroke-width="2.4"/><rect x="1405" y="420" width="8" height="114" rx="4" fill="#e07a00"/><text x="1427" y="447" font-size="18" fill="#1d2430" font-weight="700" text-anchor="start">U1 regulador</text><text x="1427" y="474" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">Vin = VBAT</text><text x="1427" y="496" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">salida +5 V</text><text x="1500" y="570" font-size="14" fill="#5b6574" font-weight="700" text-anchor="middle">→ Etapa 2</text><rect x="40" y="600" width="1520" height="180" rx="12" fill="#fff" stroke="#d62828" stroke-width="2.4"/><rect x="40" y="600" width="8" height="180" rx="4" fill="#d62828"/><text x="62" y="627" font-size="18" fill="#1d2430" font-weight="700" text-anchor="start">Por qué cada parte</text><text x="62" y="654" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">Q1 pierde mucho menos que un diodo (un SS34 cae ~0,4 V y disipa en el camino de los motores).</text><text x="62" y="676" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">F1: fusible reseteable de 2 A. [verificar la corriente de bloqueo de los N20]</text><text x="62" y="698" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">C1 y C2 van pegados al TB6612FNG, no al conector de batería: ahí se necesita la energía de los picos de motor.</text><text x="62" y="720" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">El divisor R1/R2 deja la batería medible en un pin del ADC1 (funciona con el Wi-Fi encendido). Con 100 nF filtra el ruido de los motores.</text><text x="62" y="742" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">No usar la batería por debajo de ~7,0 V (3,5 V por celda): el regulador de 5 V pierde margen y los Sharp derivan.</text></svg>