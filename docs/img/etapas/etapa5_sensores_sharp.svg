<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="avbat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62828"/></marker><marker id="av5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07a00"/></marker><marker id="av3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fd8"/></marker><marker id="agnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="asig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d8b"/></marker><marker id="amot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b2cbf"/></marker></defs><rect width="100%" height="100%" fill="#f3f5f8"/><text x="40" y="48" font-size="30" fill="#1d2430" font-weight="800" text-anchor="start">Etapa 5 — Cuatro sensores Sharp GP2Y0E03</text><text x="40" y="76" font-size="16" fill="#5b6574" font-weight="400" text-anchor="start">Alimentados a +5 V, con VIN(IO) y GPIO1 del sensor a 3,3 V · salida analógica de hasta 2,3 V al ADC1 · rango 4 – 50 cm</text><rect x="40" y="96" width="22" height="8" rx="4" fill="#d62828"/><text x="68" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">VBAT 7,4 V</text><rect x="178" y="96" width="22" height="8" rx="4" fill="#e07a00"/><text x="206" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">+5 V</text><rect x="268" y="96" width="22" height="8" rx="4" fill="#1d6fd8"/><text x="296" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">+3,3 V</text><rect x="374" y="96" width="22" height="8" rx="4" fill="#555555"/><text x="402" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">GND</text><rect x="456" y="96" width="22" height="8" rx="4" fill="#1f9d8b"/><text x="484" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">señal</text><rect x="554" y="96" width="22" height="8" rx="4" fill="#7b2cbf"/><text x="582" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">motor</text><text x="662" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">·  Borde punteado = fuera de la placa principal</text><text x="40" y="180" font-size="19" fill="#1d2430" font-weight="700" text-anchor="start">Un sensor (los 4 se conectan igual)</text><rect x="40" y="200" width="150" height="470" rx="8" fill="#fff" stroke="#5b6574" stroke-width="2" stroke-dasharray="7 5"/><text x="115" y="222" font-size="13" fill="#5b6574" font-weight="700" text-anchor="middle">Placa</text><text x="60" y="255" font-size="15" fill="#e07a00" font-weight="700" text-anchor="start">+5 V</text><text x="60" y="345" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="start">OUT</text><text x="60" y="435" font-size="15" fill="#555555" font-weight="700" text-anchor="start">GND</text><text x="60" y="525" font-size="15" fill="#1d6fd8" font-weight="700" text-anchor="start">+3,3 V</text><path d="M135,250 L330,250" fill="none" stroke="#e07a00" stroke-width="3.4" stroke-linejoin="round"/><circle cx="190" cy="250" r="4.5" fill="#e07a00"/><path d="M190,250 L190,290" fill="none" stroke="#e07a00" stroke-width="3" stroke-linejoin="round"/><line x1="177" y1="290" x2="203" y2="290" stroke="#e07a00" stroke-width="3.2"/><line x1="177" y1="298" x2="203" y2="298" stroke="#e07a00" stroke-width="3.2"/><path d="M190,298 L190,312" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="179.0" y1="312" x2="201.0" y2="312" stroke="#555555" stroke-width="3"/><line x1="183.0" y1="317" x2="197.0" y2="317" stroke="#555555" stroke-width="3"/><line x1="187.0" y1="322" x2="193.0" y2="322" stroke="#555555" stroke-width="3"/><text x="207" y="300" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">10 µF</text><circle cx="285" cy="250" r="4.5" fill="#e07a00"/><path d="M285,250 L285,290" fill="none" stroke="#e07a00" stroke-width="3" stroke-linejoin="round"/><line x1="272" y1="290" x2="298" y2="290" stroke="#e07a00" stroke-width="3.2"/><line x1="272" y1="298" x2="298" y2="298" stroke="#e07a00" stroke-width="3.2"/><path d="M285,298 L285,312" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="274.0" y1="312" x2="296.0" y2="312" stroke="#555555" stroke-width="3"/><line x1="278.0" y1="317" x2="292.0" y2="317" stroke="#555555" stroke-width="3"/><line x1="282.0" y1="322" x2="288.0" y2="322" stroke="#555555" stroke-width="3"/><text x="302" y="300" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">100 nF</text><path d="M330,250 L480,250" fill="none" stroke="#e07a00" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#av5)"/><path d="M480,340 L135,340" fill="none" stroke="#1f9d8b" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#asig)"/><circle cx="200" cy="340" r="4.5" fill="#1f9d8b"/><path d="M200,340 L200,370" fill="none" stroke="#1f9d8b" stroke-width="3" stroke-linejoin="round"/><line x1="187" y1="370" x2="213" y2="370" stroke="#1f9d8b" stroke-width="3.2"/><line x1="187" y1="378" x2="213" y2="378" stroke="#1f9d8b" stroke-width="3.2"/><path d="M200,378 L200,392" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="189.0" y1="392" x2="211.0" y2="392" stroke="#555555" stroke-width="3"/><line x1="193.0" y1="397" x2="207.0" y2="397" stroke="#555555" stroke-width="3"/><line x1="197.0" y1="402" x2="203.0" y2="402" stroke="#555555" stroke-width="3"/><text x="217" y="380" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">100 nF</text><path d="M135,430 L480,430" fill="none" stroke="#555555" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#agnd)"/><path d="M135,520 L470,520" fill="none" stroke="#1d6fd8" stroke-width="3.4" stroke-linejoin="round"/><path d="M470,520 L480,520" fill="none" stroke="#1d6fd8" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#av3)"/><circle cx="440" cy="520" r="4.5" fill="#1d6fd8"/><path d="M440,520 L440,610 L480,610" fill="none" stroke="#1d6fd8" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#av3)"/><rect x="375" y="215" width="40" height="330" rx="6" fill="#eef1f6" stroke="#5b6574" stroke-width="2"/><text x="395" y="207" font-size="12.5" fill="#5b6574" font-weight="700" text-anchor="middle">CN 4 hilos</text><rect x="480" y="200" width="260" height="530" rx="10" fill="#1b2b45"/><text x="610" y="232" font-size="20" fill="#fff" font-weight="800" text-anchor="middle">GP2Y0E03</text><text x="610" y="254" font-size="13" fill="#cbd3df" font-weight="400" text-anchor="middle">4 – 50 cm</text><text x="496" y="255" font-size="15" fill="#fff" font-weight="700" text-anchor="start">1  VDD</text><text x="496" y="345" font-size="15" fill="#fff" font-weight="700" text-anchor="start">2  Vout</text><text x="496" y="435" font-size="15" fill="#fff" font-weight="700" text-anchor="start">3  GND</text><text x="496" y="525" font-size="15" fill="#fff" font-weight="700" text-anchor="start">4  VIN(IO)</text><text x="496" y="615" font-size="15" fill="#fff" font-weight="700" text-anchor="start">5  GPIO1</text><text x="496" y="668" font-size="14" fill="#9fb0c8" font-weight="700" text-anchor="start">6 SCL · 7 SDA</text><text x="496" y="690" font-size="13" fill="#9fb0c8" font-weight="400" text-anchor="start">sin conectar</text><text x="40" y="700" font-size="13.5" fill="#1d2430" font-weight="700" text-anchor="start">Obligatorio: si VDD ≥ 3,6 V, VIN(IO) va a 3,3 V.</text><text x="40" y="722" font-size="13.5" fill="#5b6574" font-weight="400" text-anchor="start">Pines 4 y 5 unidos al hilo de 3,3 V en el sensor.</text><text x="40" y="744" font-size="13.5" fill="#5b6574" font-weight="400" text-anchor="start">El 100 nF en OUT es opcional.</text><rect x="800" y="170" width="760" height="215" rx="12" fill="#fff" stroke="#1f9d8b" stroke-width="2.4"/><rect x="800" y="170" width="8" height="215" rx="4" fill="#1f9d8b"/><text x="822" y="197" font-size="18" fill="#1d2430" font-weight="700" text-anchor="start">Dónde va cada sensor</text><text x="830" y="232" font-size="15" fill="#1d2430" font-weight="700" text-anchor="start">Sharp</text><text x="940" y="232" font-size="15" fill="#1d2430" font-weight="700" text-anchor="start">posición</text><text x="1330" y="232" font-size="15" fill="#1d2430" font-weight="700" text-anchor="start">GPIO (ADC1)</text><text x="830" y="260" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">I</text><text x="940" y="260" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">lateral izquierdo · 90°</text><text x="1330" y="260" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="start">GPIO1</text><text x="830" y="288" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">FI</text><text x="940" y="288" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">frontal izquierdo · 0°</text><text x="1330" y="288" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="start">GPIO2</text><text x="830" y="316" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">FD</text><text x="940" y="316" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">frontal derecho · 0°</text><text x="1330" y="316" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="start">GPIO4</text><text x="830" y="344" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">D</text><text x="940" y="344" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">lateral derecho · 90°</text><text x="1330" y="344" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="start">GPIO5</text><rect x="800" y="410" width="760" height="520" rx="12" fill="#fff" stroke="#5b6574" stroke-width="2"/><text x="824" y="440" font-size="17" fill="#1d2430" font-weight="700" text-anchor="start">Ubicación y ángulos (vista superior, frente hacia arriba)</text><rect x="1060" y="570" width="190" height="270" rx="10" fill="#e8ecf3" stroke="#1d2430" stroke-width="2.4"/><rect x="1038" y="710" width="22" height="90" rx="4" fill="#445"/><rect x="1250" y="710" width="22" height="90" rx="4" fill="#445"/><text x="1155.0" y="760" font-size="18" fill="#1d2430" font-weight="800" text-anchor="middle">AUS_KIM</text><path d="M1105,570 L1079,500 L1131,500 z" fill="#1f9d8b" fill-opacity="0.22" stroke="#1f9d8b" stroke-width="1.5"/><rect x="1096" y="566" width="18" height="14" rx="3" fill="#1f9d8b"/><text x="1105" y="600" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="middle">FI</text><path d="M1205,570 L1179,500 L1231,500 z" fill="#1f9d8b" fill-opacity="0.22" stroke="#1f9d8b" stroke-width="1.5"/><rect x="1196" y="566" width="18" height="14" rx="3" fill="#1f9d8b"/><text x="1205" y="600" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="middle">FD</text><path d="M1105,488 L1205,488" fill="none" stroke="#5b6574" stroke-width="2" stroke-linejoin="round" marker-end="url(#amut)" marker-start="url(#amut)"/><text x="1155.0" y="478" font-size="13" fill="#5b6574" font-weight="700" text-anchor="middle">40 – 60 mm</text><path d="M1060,670 L990,644 L990,696 z" fill="#1f9d8b" fill-opacity="0.22" stroke="#1f9d8b" stroke-width="1.5"/><rect x="1053" y="661" width="14" height="18" rx="3" fill="#1f9d8b"/><text x="970" y="675" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="middle">I</text><path d="M1250,670 L1320,644 L1320,696 z" fill="#1f9d8b" fill-opacity="0.22" stroke="#1f9d8b" stroke-width="1.5"/><rect x="1243" y="661" width="14" height="18" rx="3" fill="#1f9d8b"/><text x="1340" y="675" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="middle">D</text><text x="824" y="862" font-size="13.5" fill="#1d2430" font-weight="400" text-anchor="start">Frontales paralelos: FI − FD da el error de orientación; pared al frente = ambos sobre el umbral.</text><text x="824" y="882" font-size="13.5" fill="#1d2430" font-weight="400" text-anchor="start">Laterales 10–20 mm delante del eje y hundidos 15–20 mm en el chasis</text><text x="824" y="900" font-size="13.5" fill="#1d2430" font-weight="400" text-anchor="start">(el mínimo de 4 cm importa en celdas de 18 cm).</text><text x="824" y="920" font-size="13" fill="#5b6574" font-weight="400" text-anchor="start">[verificar] las posiciones reales contra el CAD del chasis.</text></svg>