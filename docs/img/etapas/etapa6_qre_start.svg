<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" font-family="DejaVu Sans, Arial, sans-serif"><defs><marker id="avbat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62828"/></marker><marker id="av5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07a00"/></marker><marker id="av3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d6fd8"/></marker><marker id="agnd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker><marker id="asig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f9d8b"/></marker><marker id="amot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b2cbf"/></marker></defs><rect width="100%" height="100%" fill="#f3f5f8"/><text x="40" y="48" font-size="30" fill="#1d2430" font-weight="800" text-anchor="start">Etapa 6 — Sensor de piso QRE1113GR y pulsador START</text><text x="40" y="76" font-size="16" fill="#5b6574" font-weight="400" text-anchor="start">El QRE va en una plaqueta externa con su propio circuito · START es un pulsador con pull-up y antirrebote por hardware</text><rect x="40" y="96" width="22" height="8" rx="4" fill="#d62828"/><text x="68" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">VBAT 7,4 V</text><rect x="178" y="96" width="22" height="8" rx="4" fill="#e07a00"/><text x="206" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">+5 V</text><rect x="268" y="96" width="22" height="8" rx="4" fill="#1d6fd8"/><text x="296" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">+3,3 V</text><rect x="374" y="96" width="22" height="8" rx="4" fill="#555555"/><text x="402" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">GND</text><rect x="456" y="96" width="22" height="8" rx="4" fill="#1f9d8b"/><text x="484" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">señal</text><rect x="554" y="96" width="22" height="8" rx="4" fill="#7b2cbf"/><text x="582" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">motor</text><text x="662" y="106" font-size="14" fill="#5b6574" font-weight="400" text-anchor="start">·  Borde punteado = fuera de la placa principal</text><rect x="40" y="150" width="760" height="560" rx="12" fill="#fff" stroke="#1f9d8b" stroke-width="2.4" stroke-dasharray="7 5"/><text x="64" y="182" font-size="19" fill="#1d2430" font-weight="700" text-anchor="start">Plaqueta externa QRE1113GR</text><rect x="64" y="205" width="64" height="20" rx="10" fill="#1d6fd8"/><text x="96.0" y="219.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">+3,3 V</text><path d="M64,255 L560,255" fill="none" stroke="#1d6fd8" stroke-width="4" stroke-linejoin="round"/><circle cx="190" cy="255" r="4.5" fill="#1d6fd8"/><path d="M190,255 L190,265" fill="none" stroke="#1d6fd8" stroke-width="3" stroke-linejoin="round"/><rect x="182" y="265" width="16" height="34" rx="3" fill="#fff" stroke="#1d6fd8" stroke-width="2.4"/><path d="M190,299 L190,309" fill="none" stroke="#1d6fd8" stroke-width="3" stroke-linejoin="round"/><text x="206" y="287.0" font-size="13" fill="#1d2430" font-weight="400" text-anchor="start">150 Ω</text><rect x="160" y="309" width="60" height="56" rx="6" fill="#fff" stroke="#1f9d8b" stroke-width="2.4"/><text x="190" y="333" font-size="14" fill="#1d2430" font-weight="700" text-anchor="middle">LED IR</text><text x="190" y="352" font-size="12" fill="#5b6574" font-weight="400" text-anchor="middle">emisor</text><path d="M190,365 L190,560" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><circle cx="400" cy="255" r="4.5" fill="#1d6fd8"/><path d="M400,255 L400,265" fill="none" stroke="#1d6fd8" stroke-width="3" stroke-linejoin="round"/><rect x="392" y="265" width="16" height="34" rx="3" fill="#fff" stroke="#1d6fd8" stroke-width="2.4"/><path d="M400,299 L400,309" fill="none" stroke="#1d6fd8" stroke-width="3" stroke-linejoin="round"/><text x="416" y="287.0" font-size="13" fill="#1d2430" font-weight="400" text-anchor="start">10 kΩ</text><circle cx="400" cy="311" r="4.5" fill="#1f9d8b"/><rect x="350" y="329" width="100" height="70" rx="6" fill="#fff" stroke="#1f9d8b" stroke-width="2.4"/><text x="400" y="355" font-size="14" fill="#1d2430" font-weight="700" text-anchor="middle">Foto-</text><text x="400" y="373" font-size="14" fill="#1d2430" font-weight="700" text-anchor="middle">transistor</text><path d="M400,311 L400,329" fill="none" stroke="#1f9d8b" stroke-width="3" stroke-linejoin="round"/><path d="M400,399 L400,560" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><path d="M400,311 L540,311" fill="none" stroke="#1f9d8b" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#asig)"/><text x="552" y="316" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="start">SENSOR → GPIO6</text><path d="M64,560 L560,560" fill="none" stroke="#555555" stroke-width="3.6" stroke-linejoin="round"/><line x1="549.0" y1="560" x2="571.0" y2="560" stroke="#555555" stroke-width="3"/><line x1="553.0" y1="565" x2="567.0" y2="565" stroke="#555555" stroke-width="3"/><line x1="557.0" y1="570" x2="563.0" y2="570" stroke="#555555" stroke-width="3"/><rect x="64" y="570" width="40" height="20" rx="10" fill="#555555"/><text x="84.0" y="584.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">GND</text><text x="64" y="640" font-size="15" fill="#1d2430" font-weight="700" text-anchor="start">Conector de 3 pines:  1 GND  ·  2 +3,3 V  ·  3 SENSOR</text><text x="64" y="664" font-size="13.5" fill="#5b6574" font-weight="400" text-anchor="start">No agregar otro pull-up en la placa principal (ya está el de 10 kΩ en la plaqueta).</text><text x="64" y="686" font-size="13.5" fill="#5b6574" font-weight="400" text-anchor="start">Se calibra desde la pestaña Sensores (captura blanco / negro).</text><rect x="840" y="150" width="720" height="560" rx="12" fill="#fff" stroke="#1f9d8b" stroke-width="2.4" stroke-dasharray="7 5"/><text x="864" y="182" font-size="19" fill="#1d2430" font-weight="700" text-anchor="start">Pulsador START (accesible desde afuera)</text><rect x="864" y="205" width="64" height="20" rx="10" fill="#1d6fd8"/><text x="896.0" y="219.5" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">+3,3 V</text><path d="M864,255 L1060,255" fill="none" stroke="#1d6fd8" stroke-width="4" stroke-linejoin="round"/><circle cx="950" cy="255" r="4.5" fill="#1d6fd8"/><path d="M950,255 L950,265" fill="none" stroke="#1d6fd8" stroke-width="3" stroke-linejoin="round"/><rect x="942" y="265" width="16" height="34" rx="3" fill="#fff" stroke="#1d6fd8" stroke-width="2.4"/><path d="M950,299 L950,309" fill="none" stroke="#1d6fd8" stroke-width="3" stroke-linejoin="round"/><text x="966" y="287.0" font-size="13" fill="#1d2430" font-weight="400" text-anchor="start">10 kΩ</text><circle cx="950" cy="309" r="4.5" fill="#1f9d8b"/><path d="M950,309 L1180,309" fill="none" stroke="#1f9d8b" stroke-width="3.4" stroke-linejoin="round" marker-end="url(#asig)"/><text x="1192" y="314" font-size="15" fill="#1f9d8b" font-weight="700" text-anchor="start">START → GPIO16</text><circle cx="1040" cy="309" r="4.5" fill="#1f9d8b"/><path d="M1040,309 L1040,349" fill="none" stroke="#1f9d8b" stroke-width="3" stroke-linejoin="round"/><line x1="1027" y1="349" x2="1053" y2="349" stroke="#1f9d8b" stroke-width="3.2"/><line x1="1027" y1="357" x2="1053" y2="357" stroke="#1f9d8b" stroke-width="3.2"/><path d="M1040,357 L1040,371" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="1029.0" y1="371" x2="1051.0" y2="371" stroke="#555555" stroke-width="3"/><line x1="1033.0" y1="376" x2="1047.0" y2="376" stroke="#555555" stroke-width="3"/><line x1="1037.0" y1="381" x2="1043.0" y2="381" stroke="#555555" stroke-width="3"/><text x="1057" y="359" font-size="12.5" fill="#5b6574" font-weight="400" text-anchor="start">100 nF</text><rect x="920" y="339" width="60" height="50" rx="6" fill="#fff" stroke="#1f9d8b" stroke-width="2.4"/><text x="950" y="361" font-size="15" fill="#1d2430" font-weight="700" text-anchor="middle">SW1</text><text x="950" y="379" font-size="12" fill="#5b6574" font-weight="400" text-anchor="middle">N.A.</text><path d="M950,309 L950,339" fill="none" stroke="#1f9d8b" stroke-width="3" stroke-linejoin="round"/><path d="M950,389 L950,560" fill="none" stroke="#555555" stroke-width="3" stroke-linejoin="round"/><line x1="939.0" y1="560" x2="961.0" y2="560" stroke="#555555" stroke-width="3"/><line x1="943.0" y1="565" x2="957.0" y2="565" stroke="#555555" stroke-width="3"/><line x1="947.0" y1="570" x2="953.0" y2="570" stroke="#555555" stroke-width="3"/><text x="864" y="640" font-size="14" fill="#1d2430" font-weight="700" text-anchor="start">GPIO16 es un pad suelto: va con un cable al pulsador.</text><text x="864" y="664" font-size="13.5" fill="#5b6574" font-weight="400" text-anchor="start">El botón BOOT del S3-Zero (GPIO0) no es accesible con la placa montada.</text><text x="864" y="686" font-size="13.5" fill="#5b6574" font-weight="400" text-anchor="start">El reglamento exige un pulsador visible y accesible para iniciar y detener.</text></svg>