ing), pero con el divisor (≤ 2,7 V) no afecta la configuración por defecto. [verificar]</text><text x="62" y="826" font-size="15" fill="#1d2430" font-weight="400" text-anchor="start">GPIO43 y 44 son la UART0: se usan como salidas normales. En el IDE: ESP32S3 Dev Module + USB CDC On Boot: Enabled.</text></svg>