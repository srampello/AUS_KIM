name: Sincronizar firmware de carrera

on:
  push:
    branches:
      - master
    paths:
      - 'firmware/05_test_suite/AUS_KIM_TEST_SUITE/AUS_KIM_TEST_SUITE.ino'
      - 'tools/generar_aus_kim_race.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generar carrera desde Test Suite
        run: python3 tools/generar_aus_kim_race.py

      - name: Guardar cambios de carrera
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- firmware/06_race/AUS_KIM_RACE/AUS_KIM_RACE.ino)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add firmware/06_race/AUS_KIM_RACE/AUS_KIM_RACE.ino
            git commit -m "sync: actualizar AUS_KIM_RACE desde Test Suite"
            git push
          else
            echo "El firmware de carrera ya esta sincronizado."
          fi
